info:
  name: UPDATE_CATEGORY
  type: http
  seq: 4

http:
  method: PUT
  url: http://{{host}}:{{port}}/api/categories/e823IW7x_iC
  body:
    type: json
    data: |-
      {
            "id": "e823IW7x_iC",
            "name": "pedro",
            "description": "Figuras Funko de personajes del mundo de los videojuegos.",
            "rowVersion": {{rowVersionK}}
          }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Debe actualizar una categoria correctamente", function () {
            expect(res.getStatus()).to.equal(200);
        });

        test("Debe devolver el nombre actualizado", function () {
            const body = res.getBody();

            expect(body.name).to.equal("pedro");
        });

        test("Debe devolver la descripcion actualizada", function () {
            const body = res.getBody();

            expect(body.description).to.equal("Figuras Funko de personajes del mundo de los videojuegos.");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
