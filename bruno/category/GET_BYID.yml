info:
  name: GET_BYID
  type: http
  seq: 1

http:
  method: GET
  url: http://{{host}}:{{port}}/api/categories/e823IW7x_iC
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("El código de respuesta es 200", function() {
            expect(res.status).to.equal(200);
        });

        test("La respuesta no está vacía", function() {
            expect(res.body).to.exist;
        });

        test("La respuesta tarda menos de 1000 ms", function() {
            expect(res.responseTime).to.be.below(1000);
        });

        test("La respuesta es de tipo JSON", function() {
            expect(res.headers["content-type"]).to.include("application/json");
        });
        bru.setEnvVar("rowVersionK", String(res.body.rowVersion));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
