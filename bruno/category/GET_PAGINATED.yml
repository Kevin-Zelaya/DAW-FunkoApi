info:
  name: GET_PAGINATED
  type: http
  seq: 2

http:
  method: GET
  url: http://{{host}}:{{port}}/api/categories?pageNumber=1&pageSize=2
  params:
    - name: pageNumber
      value: "1"
      type: query
    - name: pageSize
      value: "2"
      type: query
  body:
    type: json
    data: ""
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("El código de respuesta es 200", function() {
            expect(res.status).to.equal(200);
        });

        test("La respuesta no está vacía", function() {
            expect(res.body).to.exist;
        });

        test("La respuesta tarda menos de 1000 ms", function() {
            expect(res.responseTime).to.be.below(1000);
        });

        test("La respuesta es de tipo JSON", function() {
            expect(res.headers["content-type"]).to.include("application/json");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
