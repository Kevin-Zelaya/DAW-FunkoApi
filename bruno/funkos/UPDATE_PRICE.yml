info:
  name: UPDATE_PRICE
  type: http
  seq: 13

http:
  method: PATCH
  url: http://{{host}}:{{port}}/api/funkos/1/price
  body:
    type: json
    data: |
      {
        "price": 17.99,
        "rowVersion": {{rowVersionf3}}}
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("El código de estado debe ser 200", function() {
            expect(res.status).to.equal(200);
        });

        test("El precio actual debe ser 17.99", function() {
            expect(res.body.currentPrice).to.equal(17.99);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
