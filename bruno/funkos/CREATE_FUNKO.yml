info:
  name: CREATE_FUNKO
  type: http
  seq: 1

http:
  method: POST
  url: http://{{host}}:{{port}}/api/funkos
  body:
    type: json
    data: |-
      {
        "name": "{{$randomFullName}}",
        "franchise": "Marvel",
        "number": 1,
        "supplierId": "6aee3ce4035ea0d4b4a44432",
        "categoryId": "e823IW7x_iC",
        "exclusive": false,
        "price": 14.99
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("El código de estado debe ser exitoso (200 o 201)", function() {
          expect(res.status).to.be.oneOf([200, 201]);
        });

        test("El Funko creado tiene el nombre correcto", function() {
          expect(res.body.name).to.be.a("string").and.not.empty;
          expect(res.body.franchise).to.equal("Marvel");
        });

        test("La respuesta devuelve un ID asignado", function() {
          expect(res.body).to.have.property('id');
        });

        if (res.body && res.body.id) {
          bru.setEnvVar("createdFunkoId", res.body.id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
