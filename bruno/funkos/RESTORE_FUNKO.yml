info:
  name: RESTORE_FUNKO
  type: http
  seq: 7

http:
  method: PATCH
  url: http://{{host}}:{{port}}/api/funkos/1/restore
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("El código de estado debe ser 200 OK", function() {
            expect(res.status).to.equal(200);
        });

        test("La respuesta debe contener un identificador", function() {
            expect(res.body).to.have.property("id");
        });

        test("La respuesta debe contener un nombre", function() {
            expect(res.body.name).to.be.a("string").and.not.empty;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
