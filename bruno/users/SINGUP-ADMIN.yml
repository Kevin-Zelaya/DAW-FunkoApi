info:
  name: SINGUP-ADMIN
  type: http
  seq: 4

http:
  method: POST
  url: http://{{host}}:{{port}}/api/auth/signup/admin
  body:
    type: json
    data: |-
      {
        "Username": "{{$randomFullName}}",
        "Email": "{{$randomEmail}}",
        "Password": "Kevinelmejor33333"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("El código de estado debe ser 200 o 201", function() {
            expect(res.status).to.be.oneOf([200, 201]);
        });

        test("La respuesta debe contener un identificador", function() {
            expect(res.body).to.have.property("userId");
        });

        test("La respuesta debe contener un nombre de usuario", function() {
            expect(res.body.username).to.be.a("string").and.not.empty;
        });

        test("El usuario debe tener el rol ADMIN", function() {
            expect(res.body.role).to.equal("ADMIN");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
