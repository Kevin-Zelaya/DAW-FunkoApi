info:
  name: ME
  type: http
  seq: 3

http:
  method: GET
  url: http://{{host}}:{{port}}/api/users/me
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("El código de estado debe ser 200 OK", function() {
            expect(res.status).to.equal(200);
        });

        test("La respuesta debe contener un identificador", function() {
            expect(res.body).to.have.property("id");
        });

        test("La respuesta debe contener un nombre de usuario", function() {
            expect(res.body.username).to.be.a("string").and.not.empty;
        });

        test("La respuesta debe contener un correo electrónico", function() {
            expect(res.body.email).to.be.a("string").and.not.empty;
        });

        test("El usuario debe tener un rol", function() {
            expect(res.body.role).to.be.a("string").and.not.empty;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
