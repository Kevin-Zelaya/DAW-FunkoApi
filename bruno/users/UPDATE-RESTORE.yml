info:
  name: UPDATE-RESTORE
  type: http
  seq: 11

http:
  method: PATCH
  url: http://{{host}}:{{port}}/api/users/2/restore
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("El código de estado debe ser 200 OK", function() {
            expect(res.status).to.equal(200);
        });

        test("La respuesta debe contener un identificador", function() {
            expect(res.body).to.have.property("id");
        });

        test("La respuesta debe contener un nombre de usuario", function() {
            expect(res.body.username).to.be.a("string").and.not.empty;
        });

        test("El usuario debe estar restaurado", function() {
            expect(res.body).to.have.property("isDeleted", false);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
