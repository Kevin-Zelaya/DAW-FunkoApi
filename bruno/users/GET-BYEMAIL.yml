info:
  name: GET-BYEMAIL
  type: http
  seq: 6

http:
  method: GET
  url: http://{{host}}:{{port}}/api/users/email/sergio@correo.com
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("El código de estado debe ser 200 OK", function() {
            expect(res.status).to.equal(200);
        });

        test("La respuesta debe contener un identificador", function() {
            expect(res.body).to.have.property("id");
        });

        test("El correo electrónico debe coincidir", function() {
            expect(res.body.email).to.equal("sergio@correo.com");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
