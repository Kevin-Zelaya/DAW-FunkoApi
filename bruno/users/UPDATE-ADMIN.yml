info:
  name: UPDATE-ADMIN
  type: http
  seq: 7

http:
  method: PUT
  url: http://{{host}}:{{port}}/api/users/me
  body:
    type: json
    data: |-
      {
        "id": 1,
        "username": "Kevo",
        "email": "pedro@gmail.com"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("El código de estado debe ser 200 OK", function() {
            expect(res.status).to.equal(200);
        });

        test("La respuesta debe contener un identificador", function() {
            expect(res.body).to.have.property("id");
        });

        test("El nombre de usuario debe ser Kevo", function() {
            expect(res.body.username).to.equal("Kevo");
        });

        test("El correo electrónico debe ser correcto", function() {
            expect(res.body.email).to.equal("pedro@gmail.com");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
