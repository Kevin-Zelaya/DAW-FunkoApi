info:
  name: GET_ALL
  type: http
  seq: 3

http:
  method: GET
  url: http://{{host}}:{{port}}/api/suppliers/all
  body:
    type: json
    data: ""
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("El código de estado debe ser 200 OK", function() {
            expect(res.status).to.equal(200);
        });

        test("La respuesta debe ser una lista de proveedores", function() {
            expect(res.body).to.be.an("array");
        });

        test("La lista debe contener proveedores", function() {
            expect(res.body.length).to.be.above(0);
        });

        test("Los proveedores deben tener un nombre", function() {
            res.body.forEach(function(proveedor) {
                expect(proveedor).to.have.property("name");
            });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
