info:
  name: GET_PAGINATED
  type: http
  seq: 2

http:
  method: GET
  url: http://{{host}}:{{port}}/api/suppliers?pageNumber=1&pageSize=5
  params:
    - name: pageNumber
      value: "1"
      type: query
    - name: pageSize
      value: "5"
      type: query
  body:
    type: json
    data: ""
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("El código de estado debe ser 200 OK", function() {
            expect(res.status).to.equal(200);
        });

        test("La respuesta debe contener una lista de proveedores", function() {
            expect(res.body.items).to.be.an("array");
        });

        test("La respuesta debe contener información de paginación", function() {
            expect(res.body).to.have.property("count");
            expect(res.body).to.have.property("totalPages");
        });

        test("La lista no debe superar los 5 proveedores", function() {
            expect(res.body.items.length).to.be.at.most(5);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
