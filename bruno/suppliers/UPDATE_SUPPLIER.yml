info:
  name: UPDATE_SUPPLIER
  type: http
  seq: 5

http:
  method: PUT
  url: http://{{host}}:{{port}}/api/suppliers/6aee3ce4035ea0d4b4a44432
  body:
    type: json
    data: |-
      {
          "id": "6af452a0581d0ba45224821e",
          "name": "Funko",
          "rowVersion": 1
        }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("El código de estado debe ser 200 OK", function() {
            expect(res.status).to.equal(200);
        });

        test("La respuesta debe contener un nombre", function() {
            expect(res.body.name).to.be.a("string").and.not.empty;
        });

        test("El proveedor debe tener un identificador", function() {
            expect(res.body).to.have.property("id");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
