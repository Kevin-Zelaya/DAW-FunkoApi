info:
  name: CREATE_SUPPLIER
  type: http
  seq: 4

http:
  method: POST
  url: http://{{host}}:{{port}}/api/suppliers
  body:
    type: json
    data: |-
      {
          "Name": "sapas"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("El código de estado debe ser 200 o 201", function() {
            expect(res.status).to.be.oneOf([200, 201]);
        });

        test("La respuesta debe contener un nombre", function() {
            expect(res.body.name).to.be.a("string").and.not.empty;
        });

        test("El proveedor debe tener un identificador", function() {
            expect(res.body).to.have.property("id");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
